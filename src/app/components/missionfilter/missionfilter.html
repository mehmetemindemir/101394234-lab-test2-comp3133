<section class="filter-panel" aria-label="Mission launch filter">
	<mat-form-field appearance="outline">
		<mat-label>Launch Year</mat-label>
		<input
			matInput
			type="text"
			maxlength="4"
			placeholder="e.g. 2018"
			[ngModel]="launchYear()"
			(ngModelChange)="launchYear.set($event)"
		/>
	</mat-form-field>

	<div class="actions">
		<button mat-flat-button type="button" (click)="applyFilter()">Apply</button>
		<button mat-stroked-button type="button" (click)="clearFilter()">Clear</button>
	</div>
</section>
